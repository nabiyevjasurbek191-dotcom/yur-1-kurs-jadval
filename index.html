<title>ARBU Yuridik 1-kurs jadvali</title>

<style>
/* Layout: sticky control bar on top (group, views, weekday tabs), then a single column of lesson rows: mono time rail + lesson block. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15212b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#17566b; --accent-soft:#dcecf1; --accent-ink:#ffffff;
  --lecture:#8a4b08; --lecture-soft:#fbead3;
  --warn:#9a3412; --warn-soft:#fde7dc; --live:#0f7a4d; --live-soft:#d9f2e6;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#18232b; --ink:#e8eef2; --muted:#9aabb8; --line:#2a3a45;
  --accent:#6fc0d8; --accent-soft:#1d3a46; --accent-ink:#0b1a21;
  --lecture:#f0b46a; --lecture-soft:#3a2b14; --warn:#f5a37a; --warn-soft:#3b2417; --live:#5fd9a2; --live-soft:#143527; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#18232b; --ink:#e8eef2; --muted:#9aabb8; --line:#2a3a45;
  --accent:#6fc0d8; --accent-soft:#1d3a46; --accent-ink:#0b1a21;
  --lecture:#f0b46a; --lecture-soft:#3a2b14; --warn:#f5a37a; --warn-soft:#3b2417; --live:#5fd9a2; --live-soft:#143527; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{display:flex;gap:4px;margin-top:10px;background:var(--bg);padding:3px;border-radius:10px;width:max-content;max-width:100%}
.views button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:48px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 8px 7px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .today::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--live)}
.tabs .n{display:block;font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--muted)}
main{padding-top:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.hero .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .t{font-size:17px;font-weight:700;text-wrap:balance}
.hero .s{font-size:13px;opacity:.9}
.hero.live{background:var(--live);color:#fff}
.hero.idle{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px}
.time{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);padding-top:14px;line-height:1.3}
.time b{display:block;font-size:14px;color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.card.now{border-color:var(--live);box-shadow:0 0 0 2px var(--live-soft)}
.card.free{background:transparent;border-style:dashed;color:var(--muted)}
.subj{font-weight:600;font-size:15px;text-wrap:balance;min-width:0}
.meta{grid-column:1;color:var(--muted);font-size:13px;min-width:0}
.room{grid-column:2;grid-row:1/span 2;text-align:right;font-family:var(--f-mono);font-weight:600;font-size:18px;line-height:1;color:var(--accent)}
.room small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.lec{background:var(--lecture-soft);color:var(--lecture)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.on{background:var(--live-soft);color:var(--live)}
.card a.zoom{color:var(--accent);font-weight:600;font-size:13px}
.note{font-size:12px;color:var(--muted);grid-column:1/-1}
.splitbox{border:1px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
.splitbox>.lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);padding:2px 4px 0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
th{background:var(--bg);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);position:sticky;top:0}
th:last-child,td:last-child{border-right:0} tr:last-child td{border-bottom:0}
td.d{font-weight:700;white-space:nowrap;background:var(--bg);width:1%}
td.d.today{color:var(--live)}
.wc{display:flex;flex-direction:column;gap:6px}
.wc div{min-width:0}
.wc b{font-weight:600;display:block}
.wc span{color:var(--muted)}
.wc .r{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.dash{color:var(--line)}
.sub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sub h3{margin:0;font-size:15px;font-weight:600}
.sub .row{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.sub .row b{color:var(--ink);font-weight:600}
.foot{font-size:12px;color:var(--muted);padding-top:8px}
@media (max-width:420px){.slot{grid-template-columns:50px minmax(0,1fr);gap:8px}.room{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

const DAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const SH=['Du','Se','Ch','Pa','Ju','Sh'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

const GROUPS=[];
for(const [form,key] of [['Kunduzgi','day'],['Kechki','eve']])
  for(const name of Object.keys(DATA[key])) GROUPS.push({id:slug(form[0]==='K'&&key==='eve'?'k-'+name:name),name,form,key,lessons:DATA[key][name]});

const todayIdx=()=>{const g=new Date().getDay();return (g+6)%7;}; // 0=Du..6=Yak
let state={g:null,v:'day',d:Math.min(todayIdx(),5)};
try{const q=new URLSearchParams(location.search).get('g');const h=q?slug(q):location.hash.slice(1);const s=localStorage.getItem('yur1-group');
  state.g=GROUPS.find(x=>x.id===h)||GROUPS.find(x=>x.id===s)||GROUPS.find(x=>x.name==='Yur 26/5')||GROUPS[0];
  const v=localStorage.getItem('yur1-view'); if(v) state.v=v;}catch(e){state.g=state.g||GROUPS.find(x=>x.name==='Yur 26/5')||GROUPS[0]}
if(todayIdx()===6) state.d=0;

function fillSelect(){
  const sel=$('#grp');let html='';
  for(const f of ['Kunduzgi','Kechki']){
    html+=`<optgroup label="${f} ta'lim">`+GROUPS.filter(g=>g.form===f).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')+'</optgroup>';
  }
  sel.innerHTML=html; sel.value=state.g.id;
  sel.onchange=()=>{state.g=GROUPS.find(g=>g.id===sel.value);try{localStorage.setItem('yur1-group',state.g.id)}catch(e){}
    try{history.replaceState(null,'','?g='+state.g.id)}catch(e){} render();};
}
const toMin=t=>{const [a,b]=t.split('-')[0].split(':').map(Number);return a*60+b};
const endMin=t=>{const [a,b]=t.split('-')[1].split(':').map(Number);return a*60+b};
const byDay=(ls,d)=>ls.filter(l=>l.day===d);
const real=l=>!l.free;
function slotsOf(g){return g.form==='Kunduzgi'?4:2}

function nowNext(g){
  const n=new Date();const di=todayIdx();const m=n.getHours()*60+n.getMinutes();
  const ls=g.lessons.filter(real);
  if(di<6){const cur=ls.filter(l=>l.day===di&&toMin(l.time)<=m&&m<endMin(l.time));
    if(cur.length) return {kind:'now',l:cur,di};}
  for(let k=0;k<8;k++){const d=(di+k)%7;if(d===6)continue;
    const c=ls.filter(l=>l.day===d&&(k>0||toMin(l.time)>m)).sort((a,b)=>a.slot-b.slot);
    if(c.length){const s=c[0].slot;return {kind:'next',l:c.filter(x=>x.slot===s),di:d,k};}}
  return null;
}
function lessonLine(l){return esc(l.subject)+(l.teacher?' · '+esc(l.teacher):'')}
function roomOf(l){return l.room?(/^\d+$/.test(l.room)?l.room+'-xona':l.room):(l.online?'Onlayn':'')}

function hero(g){
  const r=nowNext(g);
  if(!r) return `<div class="hero idle"><div class="k">Dars yo'q</div><div class="t">Bu guruhda dars topilmadi</div></div>`;
  const first=r.l[0];
  const when=r.kind==='now'?'Hozir davom etmoqda':(r.k===0?`Bugun, ${first.time.split('-')[0]} da`:r.k===1?`Ertaga, ${first.time.split('-')[0]} da`:`${DAYS[r.di]}, ${first.time.split('-')[0]} da`);
  const body=r.l.map(l=>`<div class="t">${esc(l.subject)}</div><div class="s">${esc(l.teacher)}${roomOf(l)?' · '+roomOf(l):''}</div>`).join('');
  return `<div class="hero ${r.kind==='now'?'live':''}"><div class="k">${r.kind==='now'?'Hozir':'Keyingi dars'} · ${when}</div>${body}</div>`;
}

function card(l,isNow){
  if(l.free) return `<div class="card free"><div class="subj">${esc(l.subject)}</div></div>`;
  const tags=[];
  if(l.type) tags.push(`<span class="tag ${l.type==="Ma'ruza"?'lec':''}">${esc(l.type)}</span>`);
  if(l.online) tags.push('<span class="tag on">Onlayn</span>');
  if(l.note) tags.push(`<span class="tag warn">${esc(l.note)} haftasi</span>`);
  if(l.with_&&l.with_.length) tags.push(`<span class="tag">Oqim: ${esc(l.with_.map(x=>x.replace('Yur ','')).join(', '))}</span>`);
  const room=roomOf(l);
  return `<div class="card${isNow?' now':''}"><div class="subj">${esc(l.subject)}</div>
    <div class="room">${room?`<small>Xona</small>${esc(room.replace('-xona',''))}`:''}</div>
    <div class="meta">${esc(l.teacher)}${l.link?` · <a class="zoom" href="${esc(l.link)}" target="_blank" rel="noopener">Zoom havola</a>`:''}</div>
    ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}</div>`;
}

function dayView(g){
  const ls=byDay(g.lessons,state.d);const di=todayIdx();
  const n=new Date();const m=n.getHours()*60+n.getMinutes();
  let out='';
  if(state.d===di) out+=hero(g);
  const real_=ls.filter(real);
  if(!real_.length){
    out+=`<div class="empty">${DAYS[state.d]} kuni ${ls.length?"faqat mustaqil ta'lim":"dars yo'q"}.</div>`;
    return out;
  }
  const slots=[...new Set(ls.map(l=>l.slot))].sort();
  for(const s of slots){
    const items=ls.filter(l=>l.slot===s);const t=items[0].time;const [a,b]=t.split('-');
    const isNow=state.d===di&&toMin(t)<=m&&m<endMin(t);
    let inner;
    if(items.length>1&&items.every(real)){
      const split=items.some(x=>x.part>0);
      inner=`<div class="splitbox"><div class="lab">${split?"Guruh ikkiga bo'linadi: kichik guruhlar":"Haftalar navbatma-navbat"}</div>${items.map(x=>card(x,isNow)).join('')}</div>`;
    } else inner=items.map(x=>card(x,isNow)).join('');
    out+=`<div class="slot"><div class="time"><b>${a}</b>${b}</div><div class="cards">${inner}</div></div>`;
  }
  return out;
}

function weekView(g){
  const cols=slotsOf(g);const times=g.form==='Kunduzgi'?['09:00-10:20','10:30-11:50','12:00-13:20','13:30-14:50']:['18:00-19:20','19:30-20:50'];
  const use=g.form==='Kunduzgi'?3:2;
  let h='<div class="scroll"><table><thead><tr><th></th>'+times.slice(0,use).map(t=>`<th>${t}</th>`).join('')+'</tr></thead><tbody>';
  for(let d=0;d<6;d++){
    const ls=byDay(g.lessons,d);
    if(!ls.some(real)&&d===5) continue;
    h+=`<tr><td class="d${d===todayIdx()?' today':''}">${SH[d]}</td>`;
    for(let s=0;s<use;s++){
      const it=ls.filter(l=>l.slot===s&&real(l));
      h+='<td>'+(it.length?`<div class="wc">${it.map(l=>`<div><b>${esc(l.subject)}${l.type==="Ma'ruza"?' <span>(ma\'ruza)</span>':''}</b><span>${esc(l.teacher)}</span> <span class="r">${esc(roomOf(l).replace('-xona',''))}</span></div>`).join('')}</div>`:'<span class="dash">—</span>')+'</td>';
    }
    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}

function subjView(g){
  const map=new Map();
  for(const l of g.lessons.filter(real)){
    if(!map.has(l.subject)) map.set(l.subject,[]);map.get(l.subject).push(l);
  }
  const arr=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'uz'));
  return arr.map(([s,ls])=>{
    const ts=[...new Set(ls.map(l=>l.teacher).filter(Boolean))];
    const lec=ls.filter(l=>l.type==="Ma'ruza").map(l=>`${SH[l.day]} ${l.time.split('-')[0]}`);
    const oth=ls.filter(l=>l.type!=="Ma'ruza").map(l=>`${SH[l.day]} ${l.time.split('-')[0]}`);
    const rooms=[...new Set(ls.map(l=>l.room).filter(Boolean))];
    const tl=t=>{const w=[...new Set(ls.filter(l=>l.teacher===t).map(l=>l.type==="Ma'ruza"?"ma'ruza":'amaliy'))];return esc(t)+' <span style="color:var(--muted)">('+w.join(', ')+')</span>'};
    return `<div class="sub"><h3>${esc(s)}</h3><div class="row"><span>O'qituvchi: <b>${ts.map(tl).join(', ')||'—'}</b></span></div>
      <div class="row">${lec.length?`<span>Ma'ruza: <b>${lec.join(', ')}</b></span>`:''}${oth.length?`<span>Amaliy/seminar: <b>${oth.join(', ')}</b></span>`:''}${rooms.length?`<span>Xona: <b>${rooms.join(', ')}</b></span>`:''}</div></div>`;
  }).join('');
}

function renderTabs(){
  const t=$('#tabs');t.hidden=state.v!=='day';
  t.innerHTML=SH.map((s,i)=>{const n=byDay(state.g.lessons,i).filter(real).length;
    return `<button type="button" role="tab" data-d="${i}" aria-selected="${i===state.d}" class="${i===todayIdx()?'today':''}">${s}<span class="n">${n?n+' dars':'—'}</span></button>`}).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.d=+b.dataset.d;render()});
}
function render(){
  document.querySelectorAll('.views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.v));
  renderTabs();
  const g=state.g;
  $('#sub').textContent=`${g.name} · ${g.form==='Kunduzgi'?'kunduzgi':'kechki'} ta'lim`;
  $('#main').innerHTML=state.v==='day'?dayView(g):state.v==='week'?weekView(g):subjView(g);
  $('#foot').textContent="Manba: 27.10.2026 sanali jadval (10 bandlik)."+(g.form==='Kechki'?" Juftliklar: 18:00 va 19:30. Surat/maxraj jadvalda navbatlashuvchi haftalar sifatida belgilangan.":" Juftliklar: 09:00, 10:30, 12:00.");
}
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>{state.v=b.dataset.v;try{localStorage.setItem('yur1-view',state.v)}catch(e){}render()});
fillSelect();render();
</script>
</body></html>
